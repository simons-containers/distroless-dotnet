name: Update versions

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Fetch latest versions
        run: |
          GCC=$(curl -s https://ftp.gnu.org/gnu/gcc/ \
            | grep -o 'gcc-[0-9]\+\.[0-9]\+\.[0-9]\+/' \
            | sed 's#gcc-##; s#/##' \
            | sort -V | tail -n 1) 
          ICU=$(git ls-remote --tags https://github.com/unicode-org/icu.git/ \
            | awk -F/ '/\/release/&& !/rc/ {gsub("release-", ""); print $3}' \
            | sort -V | tail -1)
          ZLIB=$(curl -s https://zlib.net/ \
            | grep -o 'zlib-[0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?\.tar\.gz' \
            | sed 's/zlib-//; s/\.tar\.gz//' \
            | sort -V | tail -n 1)
          OPENSSL=$(git ls-remote --tags https://github.com/openssl/openssl.git/ \
            | awk -F/ '/[0-9]$/  && /openssl-/ && ! /-[a-z]/ {gsub("openssl-", ""); print $3}' \
            | sort -V | grep -Ev '^4' | tail -1)
          LIBUNWIND=$(git ls-remote --tags https://github.com/libunwind/libunwind.git/  \
            | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -1)
          DOTNET=$(git ls-remote --tags https://github.com/dotnet/core.git/  \
            | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -1)

          set -u
          yq -i ".gcc= \"$GCC\"" versions.yaml
          yq -i ".icu= \"$ICU\"" versions.yaml
          yq -i ".zlib= \"$ZLIB\"" versions.yaml
          yq -i ".openssl= \"$OPENSSL\"" versions.yaml
          yq -i ".libunwind= \"$LIBUNWIND\"" versions.yaml
          yq -i ".dotnet= \"$DOTNET\"" versions.yaml
          git diff versions.yaml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-versions
          delete-branch: true
          title: Update versions
          commit-message: Update versions
